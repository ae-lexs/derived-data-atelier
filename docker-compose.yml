# docker-compose.yml — Derived Data Atelier toolchain
#
# Per ADR-DDA-013, all toolchain runs inside Docker. The host needs:
#   - Docker + Compose
#   - AWS CLI configured with the SSO profile "derived-data-atelier"
#   - An active SSO session (run `aws sso login --profile derived-data-atelier`
#     before invoking any compose service — the token cache lives in ~/.aws/sso/
#     and is shared with the container via the read-write mount below)
#
# The ~/.aws mount is read-write (not read-only) because the AWS SDK refreshes
# the SSO access token to ~/.aws/sso/cache/<hash>.json when the cached token
# nears expiry. A read-only mount works for the first session after `aws sso
# login` but fails the next time the SDK tries to refresh.

services:
  terraform:
    image: hashicorp/terraform:1.9
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ~/.aws:/root/.aws
      - terraform_plugin_cache:/root/.terraform.d/plugin-cache
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-derived-data-atelier}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      TF_PLUGIN_CACHE_DIR: /root/.terraform.d/plugin-cache
      TF_INPUT: "0"
    profiles: [tools]
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - "-path=/migrations"
      - "-database=postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:5432/${PGDATABASE}?sslmode=require"
      - "up"
    profiles: [seed]
  seed:
    build:
      context: .
      dockerfile: docker/dbgen.Dockerfile
    environment:
      PGHOST: ${PGHOST}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE}
      TPCH_SCALE: "1"
    volumes:
      - tpch_data:/data
    profiles: [seed]
  build:
    image: golang:1.22-alpine
    working_dir: /workspace/api
    volumes:
      - .:/workspace
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: "-buildvcs=false"
    profiles: [tools]
  k6:
    image: grafana/k6:0.50.0
    working_dir: /scripts
    volumes:
      - ./loadtest:/scripts:ro
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    profiles: [loadtest]
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      PG_HOST:       ${PG_HOST:-pg-fixture}
      PG_PORT:       "5432"
      PG_USER:       ${PG_USER:-dda_master}
      PG_PASSWORD:   ${PG_PASSWORD:-fixture}
      PG_DATABASE:   ${PG_DATABASE:-tpch}
      PG_SSL_MODE:   ${PG_SSL_MODE:-disable}
      USE_IAM_AUTH:  ${USE_IAM_AUTH:-false}
      AWS_REGION:    ${AWS_REGION:-us-east-1}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://localhost:4318}
      SERVICE_NAME:  ${SERVICE_NAME:-dda-api}
    depends_on:
      pg-fixture:
        condition: service_healthy
    profiles: [smoke]
  pg-fixture:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     dda_master
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB:       tpch
    volumes:
      - ./api/testdata/fixture.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dda_master -d tpch"]
      interval: 2s
      timeout: 2s
      retries: 10
    profiles: [smoke]

volumes:
  terraform_plugin_cache:
  tpch_data:
  go_mod_cache:
  go_build_cache:
